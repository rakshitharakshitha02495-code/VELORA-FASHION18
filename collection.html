<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collections — Velora Fashion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html"><img src="v2.png" alt="Velora Logo" class="brand-logo-img"></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="collections.html" class="nav-link active">Collections</a>
        <a href="lookbook.html" class="nav-link">Lookbook</a>
        <a href="about.html" class="nav-link">Our Atelier</a>
        <a href="appointment.html" class="nav-link">Bespoke Booking</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleCartDrawer()"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cart-badge">0</span></button>
      </div>
    </div>
  </header>

  <div class="page-header">
    <h1>The Womenswear Collection</h1>
    <p>Explore luxury gowns, haute couture, and tailored ready-to-wear designs</p>
  </div>

  <div class="filter-bar">
    <div class="cat-tabs">
      <button class="tab-btn active" onclick="setCategoryFilter('all', this)">All Creations</button>
      <button class="tab-btn" onclick="setCategoryFilter('gowns', this)">Evening Gowns</button>
      <button class="tab-btn" onclick="setCategoryFilter('couture', this)">Haute Couture</button>
      <button class="tab-btn" onclick="setCategoryFilter('rtw', this)">Ready-To-Wear</button>
    </div>
  </div>

  <section class="section">
    <div class="grid grid-4" id="collections-grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
